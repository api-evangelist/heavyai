  notes: >-
    No formal HTTP Sunset/Deprecation-header policy applies (this is self-hosted
    database software, not a hosted REST API). End-of-support is expressed through
    the "Currently Supported Releases" list on the release-notes page; releases no
    longer supported move to Archived Release Notes with links to their historical
    documentation. Upgrade guidance recommends backing up data and testing new
    releases before production deployment.
