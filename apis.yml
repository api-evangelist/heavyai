- name: HEAVY.AI Platform APIs
  description: >-
    The developer interfaces to the HEAVY.AI platform: native SQL against the
    GPU-accelerated HeavyDB engine, an Apache Thrift API, JDBC/ODBC drivers, the
    heavysql CLI console, a Python client (heavyai) and a JavaScript connector,
    and the Vega server-side rendering API. HeavyDB is typically self-hosted, so
    the base endpoint (default port 6274) is deployment-specific.
