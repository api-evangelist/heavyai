name: HEAVY.AI
description: >-
  HEAVY.AI is a GPU-accelerated analytics platform (formerly OmniSci / MapD, now
  part of NVIDIA) built to interactively query and visualize very large, often
  geospatial and time-series, datasets. It pairs an open-source, GPU-accelerated
  SQL database (HeavyDB) with a server-side rendering engine (HeavyRender) and a
  web-based visual analytics application (Heavy Immerse). Developers interact
  with the platform through native SQL, an Apache Thrift API, JDBC/ODBC drivers,
  the heavysql command-line console, a Python data-science client (heavyai) and a
  JavaScript connector (@heavyai/connector), plus a Vega-based rendering API. The
  documentation is published on the NVIDIA docs site and exposes an llms.txt index
  and a hosted MCP server for AI agents.
